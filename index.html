<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sigma Survival | Home</title>
    <!-- Google Fonts for Clean Gaming Typography -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4757;
            --primary-hover: #ff6b81;
            --discord: #5865f2;
            --discord-hover: #7289da;
            --bg-dark: #0f0c1b;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f1f2f6;
            --text-muted: #a4b0be;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255, 71, 87, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(112, 111, 211, 0.05) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navigation Bar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 8%;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 12, 27, 0.7);
            width: 100%;
        }

        .logo {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 24px;
            letter-spacing: 1px;
            color: #fff;
        }

        .logo span {
            color: var(--primary);
        }

        .nav-links {
            list-style: none;
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        /* Hero Section */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 20px;
            flex-grow: 1;
            position: relative;
            gap: 20px;
        }

        .hero h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 4.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 5px;
            line-height: 1.1;
            background: linear-gradient(135deg, #ffffff 40%, #ced6e0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.5rem;
            color: var(--text-muted);
            max-width: 600px;
            margin-bottom: 20px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* Copyable IP Card */
        .ip-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 15px 30px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 20px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: transform 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        .ip-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 71, 87, 0.4);
            box-shadow: 0 10px 30px rgba(255, 71, 87, 0.1);
        }

        .ip-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .ip-address {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .copy-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
            transition: background 0.2s;
        }

        .ip-card:hover .copy-btn {
            background: var(--primary-hover);
        }

        /* Discord Button Styling */
        .discord-btn {
            background-color: var(--discord);
            color: white;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            padding: 16px 40px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.2);
            transition: transform 0.3s, background-color 0.3s, box-shadow 0.3s;
            margin-top: 10px;
        }

        .discord-btn:hover {
            background-color: var(--discord-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(88, 101, 242, 0.4);
        }

        .discord-icon {
            font-size: 1.3rem;
        }

        /* Toast Popup Notification */
        .toast {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: #2ed573;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: 600;
            box-shadow: 0 10px 20px rgba(46, 213, 115, 0.3);
            transition: bottom 0.4s ease;
            z-index: 1000;
        }

        .toast.show {
            bottom: 40px;
        }

        /* Responsive Settings */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.8rem; }
            nav { flex-direction: column; gap: 15px; text-align: center; }
            .ip-card { flex-direction: column; gap: 8px; border-radius: 20px; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- Top Navigation Menu -->
    <nav>
        <div class="logo">Sigma<span>Survival</span></div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
        </ul>
    </nav>

    <!-- Hero Showcase Section -->
    <section class="hero">
        <h1>Sigma Survival</h1>
        <p>Best Vanilla Minecraft SMP.</p>
        
        <!-- Interactive IP Address Copy Component -->
        <div class="ip-card" onclick="copyIp()">
            <div>
                <div class="ip-label">Server IP Address</div>
                <div class="ip-address" id="serverIp">sigmasurvivalest.falix.pro</div>
            </div>
            <button class="copy-btn" id="btnText">Copy IP</button>
        </div>

        <!-- Styled Discord Button -->
        <a href="https://discord.gg/HewXDJ2q" target="_blank" class="discord-btn">
            <span class="discord-icon">💬</span> Join Our Discord
        </a>
    </section>

    <!-- Copy Alert Pop-up Notification -->
    <div class="toast" id="copyToast">IP Copied to Clipboard! Ready to Play.</div>

    <!-- The safe, flat-proof single line JavaScript layout -->
    <script>
        function copyIp() { const ipText = document.getElementById("serverIp").innerText; navigator.clipboard.writeText(ipText).then(() => { const toast = document.getElementById("copyToast"); const btnText = document.getElementById("btnText"); btnText.innerText = "Copied!"; toast.classList.add("show"); setTimeout(function(){ toast.classList.remove("show"); btnText.innerText = "Copy IP"; }, 2500); }); }
    </script>
</body>
</html>
